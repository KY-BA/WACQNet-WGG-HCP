architecture:
  name: BTI-WACQNet
  spatial_size: [16, 16]
  conv_filters: [24, 48, 64]
  conv_kernel: 3
  activation: swish
  normalization: layer_normalization
  contrast_operator: template_foreground_minus_background_masked_pooling
  condition_mlp_units: [32, 32]
  fusion_units: [128, 64]
  dropout: 0.15
  max_log_correction: 0.75
  outputs:
    point: residual_corrected_nonnegative_emission
    lower_scale: positive_asymmetric_half_width
    upper_scale: positive_asymmetric_half_width
    risk_score: relative_predicted_interval_width

loss:
  point:
    formula: huber((Q_hat-Q)/(Q+1), delta=0.30)
    weight: 1.0
  lower_quantile:
    tau: 0.05
    formula: pinball((Q-(Q_hat-s_minus))/(Q+1), tau=0.05)
    weight: 0.50
  upper_quantile:
    tau: 0.95
    formula: pinball((Q-(Q_hat+s_plus))/(Q+1), tau=0.95)
    weight: 0.50
  width_regularization:
    formula: (s_minus+s_plus)/(Q+1)
    weight: 0.01
  anchor_regularization:
    formula: squared_log_correction
    weight: 0.02
  group_dro:
    eta: 0.10
    update: exponentiated_gradient_on_background_mean_loss_per_epoch
    initial_group_weights: uniform
    group_weight_clip: [0.25, 4.0]

training:
  training_seed: 20260927
  optimizer: Adam
  learning_rate: 0.0003
  weight_decay: 0.00001
  epochs: 18
  batch_size: 256
  gradient_clip_norm: 5.0
  early_stopping: false
  mixed_precision: false
  training_repetitions_per_condition: [0, 25]
  training_rows_per_background: 270
  lobo_calibration_repetitions_per_condition: [1, 13, 26, 38]
  lobo_calibration_rows_per_background: 540
  heldout_evaluation_rows_per_background: 6750
  seed_policy: sha256(base_seed, heldout_background, ablation_id)

ablations:
  reference:
    id: HPR_FROZEN
    trainable: false
  trained:
    - id: WACQ_NO_WIND
      use_wind_coordinates: false
      use_template: false
      use_contrast: false
      use_group_dro: true
    - id: WACQ_NO_CONTRAST
      use_wind_coordinates: true
      use_template: true
      use_contrast: false
      use_group_dro: true
    - id: WACQ_NO_GDRO
      use_wind_coordinates: true
      use_template: true
      use_contrast: true
      use_group_dro: false
    - id: WACQ_FULL
      use_wind_coordinates: true
      use_template: true
      use_contrast: true
      use_group_dro: true
  primary_candidate: WACQ_FULL
  ablations_can_replace_primary: false

validation:
  protocol: 36-background leave-one-background-out
  folds: 36
  training_groups_per_fold: 35
  heldout_groups_per_fold: 1
  heldout_used_for_training: false
  heldout_used_for_early_stopping: false
  heldout_used_for_hyperparameter_selection: false
  evaluation_unit: background
  point_metrics: [median_ape, p_reliable30, mae, scale_compression_slope, scale_compression_intercept]
  risk_metrics: [spearman_risk_ape, auroc_unreliable30, auprc_unreliable30, unreliable_prevalence]
  interval_calibration:
    model_fit_and_qhat_rows_disjoint: true
    qhat_repetitions_per_condition: [1, 13, 26, 38]
    score: max((Q_hat-Q)/s_minus, (Q-Q_hat)/s_plus)
    within_group_quantile: finite_sample_90pct
    group_guard: maximum_training_group_quantile
    nominal_coverage: 0.90
  interval_metrics: [picp90, mpiw, normalized_width, lower_zero_fraction]

adoption_gate:
  status: preregistered_engineering_gate_not_theoretical_guarantee
  point:
    maximum_macro_median_ape_ratio_vs_hpr: 0.90
    minimum_macro_p_reliable30_gain_vs_hpr: 0.05
    minimum_backgrounds_with_lower_median_ape: 24
    minimum_relative_scale_slope_gap_reduction: 0.20
  risk:
    minimum_backgrounds_spearman_positive: 30
    minimum_backgrounds_auprc_above_prevalence: 30
  interval:
    maximum_backgrounds_picp_below_0_80: 0
    maximum_backgrounds_picp_below_0_85: 1
    minimum_macro_normalized_width_reduction_vs_frozen_a4: 0.10
  decision:
    success: WACQNET_DEVELOPMENT_GATE_PASSED
    failure: WACQNET_NOT_ESTABLISHED
    no_posthoc_gate_changes: true

